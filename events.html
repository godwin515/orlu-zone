<!doctype html>
<!-- Location: events.html (project root)
     Opened as events.html (upcoming) or events.html?when=past, with &page=<n> for past events -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events</title>
  <meta name="description" content="Upcoming and past events in the Orlu community.">
  <link rel="icon" href="/assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>

  <main id="main" class="events-page">
    <header class="page-header">
      <div class="container">
        <h1 class="page-header__title">Events</h1>
        <p class="page-header__lead">Meetings, festivals and gatherings. Times are shown in Nigerian time (WAT).</p>
      </div>
    </header>

    <div class="section container">
      <div class="group-title page-intro">
        <div class="group-title__row">
          <span class="group-title__rule" aria-hidden="true"></span>
          <h2 class="group-title__name" data-section-title>Gatherings of the Zone</h2>
          <span class="group-title__rule" aria-hidden="true"></span>
        </div>
      </div>
      <nav class="filters" aria-label="Show upcoming or past events" data-tabs>
        <ul class="filters__list">
          <li><a class="chip" href="/events.html" data-when="upcoming">Upcoming</a></li>
          <li><a class="chip" href="/events.html?when=past" data-when="past">Past</a></li>
        </ul>
      </nav>
      <p class="visually-hidden" aria-live="polite" data-count></p>
      <div data-events></div>
      <nav class="pagination" aria-label="Past event pages" data-pagination></nav>
    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module" src="/js/pages/events.js"></script>
</body>
</html>
