<!doctype html>
<!-- Location: documents.html (project root). Published PDFs from GET /documents -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents</title>
  <meta name="description" content="Forms, reports and other documents from the Orlu community, ready to download.">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>

  <main id="main">
    <header class="page-header">
      <div class="container">
        <h1 class="page-header__title">Documents</h1>
        <p class="page-header__lead">Forms, reports and notices from the community. All documents are PDFs.</p>
      </div>
    </header>

    <div class="section container">
      <div class="doc-tools" data-tools hidden>
        <label class="visually-hidden" for="doc-filter">Find a document</label>
        <input class="doc-tools__input" id="doc-filter" type="search" placeholder="Find a document by name" data-filter autocomplete="off">
      </div>
      <p class="list-count" aria-live="polite" data-count></p>
      <div data-documents></div>
    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module" src="/js/pages/documents.js"></script>
</body>
</html>
