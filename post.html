<!doctype html>
<!-- Location: post.html (project root). Opened as post.html?slug=<post-slug> -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News</title>
  <meta name="description" content="News from the Orlu community.">
  <link rel="icon" href="/assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="/css/base.css?v=20261021">
  <link rel="stylesheet" href="/css/components.css?v=20261021">
  <link rel="stylesheet" href="/css/site.css?v=20261021">

  <!-- Markdown parser and HTML sanitizer for post content (see js/content.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>

  <main id="main" class="story-page">
    <!-- The story: top section, story box and details card (built by js/pages/post.js) -->
    <div data-article-body></div>

    <section class="section container ev-related" aria-labelledby="related-title" data-related-section hidden>
      <div class="group-title page-intro">
        <div class="group-title__row">
          <span class="group-title__rule" aria-hidden="true"></span>
          <h2 class="group-title__name" id="related-title">More in <span data-related-category>this category</span></h2>
          <span class="group-title__rule" aria-hidden="true"></span>
        </div>
      </div>
      <div data-related-posts></div>
      <p class="ev-related__all"><a class="button button--gold" href="/posts.html" data-related-link>See all news</a></p>
    </section>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <!-- Module scripts run after the deferred libraries above -->
  <script type="module" src="/js/pages/post.js"></script>
</body>
</html>
