<!doctype html>
<!-- Location: gallery.html (project root) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <meta name="description" content="Photos from events and everyday life across Orlu Land.">
  <link rel="icon" href="/assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="/css/base.css?v=20261021">
  <link rel="stylesheet" href="/css/components.css?v=20261021">
  <link rel="stylesheet" href="/css/site.css?v=20261021">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>

  <main id="main">
    <header class="page-header">
      <div class="container">
        <h1 class="page-header__title">Gallery</h1>
        <p class="page-header__lead">Photos from community events and everyday life at home. Tap any photo to see it full size.</p>
      </div>
    </header>

    <div class="section container">
      <div class="group-title gallery-intro">
        <div class="group-title__row">
          <span class="group-title__rule" aria-hidden="true"></span>
          <h2 class="group-title__name">Moments of Orlu Land</h2>
          <span class="group-title__rule" aria-hidden="true"></span>
        </div>
        <p class="visually-hidden" aria-live="polite" data-count></p>
      </div>
      <div class="gallery-page" data-gallery></div>
      <div class="load-more" data-load-more hidden>
        <button type="button" class="button button--quiet" data-load-more-button>Show more photos</button>
      </div>
    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module" src="/js/pages/gallery.js"></script>
</body>
</html>
