<!doctype html>
<!-- Location: event.html (project root). Opened as event.html?slug=<event-slug> -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event</title>
  <meta name="description" content="An event in the Orlu community.">
  <link rel="icon" href="assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/site.css">

  <!-- Markdown parser and HTML sanitizer for the description (see js/content.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>

  <main id="main">
    <article class="article" data-article>
      <div class="container article__container" data-event-body></div>
    </article>

    <section class="section container band--light band--bleed" aria-labelledby="event-news-title" data-news-section hidden>
      <div class="section-head">
        <h2 id="event-news-title">News about this event</h2>
      </div>
      <div data-event-news></div>
    </section>

    <section class="section container band--light band--bleed" aria-labelledby="more-events-title" data-more-section hidden>
      <div class="section-head">
        <h2 id="more-events-title">Other upcoming events</h2>
        <a href="events.html">All events</a>
      </div>
      <div data-more-events></div>
    </section>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module" src="js/pages/event.js"></script>
</body>
</html>
