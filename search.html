<!doctype html>
<!-- Location: search.html (project root). Opened as search.html?q=<words>[&page=<n>] -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <meta name="description" content="Search news and events from the Orlu community.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>

  <main id="main">
    <header class="page-header">
      <div class="container">
        <h1 class="page-header__title">Search</h1>
        <form class="search-page-form" action="/search.html" method="get" role="search" data-search-form>
          <label class="visually-hidden" for="search-page-input">Search news and events</label>
          <input id="search-page-input" name="q" type="search" placeholder="Search news and events"
            autocomplete="off" required data-search-input>
          <button class="button" type="submit">Search</button>
        </form>
      </div>
    </header>

    <div class="section container">
      <p class="list-count" aria-live="polite" data-count></p>
      <div data-results></div>
      <nav class="pagination" aria-label="Search result pages" data-pagination></nav>
    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module" src="/js/pages/search.js"></script>
</body>
</html>
