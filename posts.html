<!doctype html>
<!-- Location: posts.html (project root)
     Opened as posts.html, posts.html?category=<slug>, and with &page=<n> -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News</title>
  <meta name="description" content="News and announcements from the Orlu community.">
  <link rel="icon" href="assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>

  <main id="main">
    <header class="page-header">
      <div class="container">
        <h1 class="page-header__title" data-page-title>News</h1>
        <p class="page-header__lead" data-page-lead>Announcements, updates and stories from across the community.</p>
      </div>
    </header>

    <div class="section container">
      <nav class="filters" aria-label="Filter news by category" data-filters></nav>
      <p class="list-count" aria-live="polite" data-count></p>
      <div data-posts></div>
      <nav class="pagination" aria-label="News pages" data-pagination></nav>
    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module" src="js/pages/posts.js"></script>
</body>
</html>
