<!doctype html>
<!-- Location: admin/index.html (admin dashboard) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin admin-pending" data-admin-page="dashboard">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="admin-shell">
    <aside class="admin-nav" data-admin-nav></aside>

    <main class="admin-main" id="main">
      <header class="admin-head">
        <div>
          <h1 class="admin-head__title" data-greeting>Dashboard</h1>
          <p class="admin-head__lead">What's on the site right now, and what needs attention.</p>
        </div>
        <div class="admin-head__actions">
          <a class="button" href="../admin/post-edit.html">New post</a>
          <a class="button button--quiet" href="../admin/event-edit.html">New event</a>
          <a class="button button--quiet" href="../admin/media.html">Upload photos</a>
        </div>
      </header>

      <section aria-labelledby="totals-title">
        <h2 class="visually-hidden" id="totals-title">Totals</h2>
        <dl class="totals" data-totals></dl>
      </section>

      <div class="dash-grid">
        <section class="panel" aria-labelledby="drafts-title">
          <div class="panel__head">
            <h2 class="panel__title" id="drafts-title">Drafts and scheduled posts</h2>
            <a href="../admin/posts.html">All posts</a>
          </div>
          <div data-drafts></div>
        </section>

        <section class="panel" aria-labelledby="events-title">
          <div class="panel__head">
            <h2 class="panel__title" id="events-title">Next events</h2>
            <a href="../admin/events.html">All events</a>
          </div>
          <div data-events></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="../js/admin/dashboard.js"></script>
</body>
</html>
