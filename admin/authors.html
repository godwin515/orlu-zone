<!doctype html>
<!-- Location: admin/authors.html (list, add and edit on one page) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authors | Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin admin-pending" data-admin-page="authors">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="admin-shell">
    <aside class="admin-nav" data-admin-nav></aside>

    <main class="admin-main" id="main">
      <header class="admin-head">
        <div>
          <h1 class="admin-head__title">Authors</h1>
          <p class="admin-head__lead">The people or teams who write posts. Every post needs an author.</p>
        </div>
      </header>

      <div class="split">
        <section class="split__main" aria-labelledby="list-title">
          <h2 class="visually-hidden" id="list-title">All authors</h2>
          <div data-authors></div>
        </section>

        <section class="panel split__side" aria-labelledby="form-title" data-form-panel>
          <h2 class="panel__title" id="form-title" data-form-title>Add an author</h2>

          <form class="form form--compact" data-author-form novalidate>
            <p class="notice notice--error" role="alert" data-form-error hidden></p>

            <div class="field">
              <label class="field__label" for="name">Name</label>
              <input class="field__input" id="name" name="name" type="text" maxlength="120" required
                placeholder="For example: Community Editorial Team">
              <p class="field__error" data-error-for="name" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="biography">Short bio <span class="field__optional">optional</span></label>
              <textarea class="field__input" id="biography" name="biography" rows="4" maxlength="600"></textarea>
              <p class="field__hint">One or two sentences about who they are.</p>
              <p class="field__error" data-error-for="biography" hidden></p>
            </div>

            <div class="field">
              <span class="field__label" id="photo-label">Profile photo <span class="field__optional">optional</span></span>
              <div class="avatar-choice" aria-labelledby="photo-label" data-photo></div>
            </div>

            <div class="form__actions">
              <button class="button" type="submit" data-save>Add author</button>
              <button class="button button--quiet" type="button" data-cancel-edit hidden>Cancel</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/js/admin/authors.js"></script>
</body>
</html>
