<!doctype html>
<!-- Location: admin/media.html (upload, browse and delete images) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media library | Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="preconnect" href="https://orlu-land-community-api.onrender.com" crossorigin>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin admin-pending" data-admin-page="media">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="admin-shell">
    <aside class="admin-nav" data-admin-nav></aside>

    <main class="admin-main" id="main">
      <header class="admin-head">
        <div>
          <h1 class="admin-head__title">Media library</h1>
          <p class="admin-head__lead">Every image uploaded to the site. Use them in posts, events, the gallery and site settings.</p>
        </div>
      </header>

      <section class="panel upload" aria-labelledby="upload-title">
        <h2 class="panel__title" id="upload-title">Upload images</h2>

        <label class="dropzone" data-dropzone>
          <input type="file" accept="image/jpeg,image/png,image/webp" multiple data-file-input class="visually-hidden">
          <span class="dropzone__main">Drag photos here, or <span class="dropzone__link">choose from your device</span></span>
          <span class="dropzone__hint">JPEG, PNG or WebP, up to 5 MB each. You can add several at once.</span>
        </label>

        <div data-queue hidden>
          <p class="field__hint">Describe each photo for people using screen readers, and add a caption if it should show under the photo.</p>
          <ul class="queue" data-queue-list></ul>
          <div class="form__actions">
            <button type="button" class="button" data-upload-all>Upload</button>
            <button type="button" class="button button--quiet" data-clear-queue>Clear</button>
          </div>
        </div>
      </section>

      <section aria-labelledby="library-title" class="library">
        <div class="library__head">
          <h2 class="panel__title" id="library-title">All images</h2>
          <div class="field field--inline field--grow library__search">
            <label class="field__label visually-hidden" for="filter-q">Find images</label>
            <input class="field__input" id="filter-q" type="search" placeholder="Find by file name, caption or description" data-filter-q>
          </div>
        </div>
        <p class="list-meta" aria-live="polite" data-count></p>
        <div data-library></div>
        <div class="load-more" data-load-more hidden>
          <button type="button" class="button button--quiet" data-load-more-button>Show more images</button>
        </div>
      </section>
    </main>
  </div>

  <dialog class="media-details" aria-labelledby="details-title" data-details>
    <div class="media-details__inner">
      <div class="media-details__image"><img alt="" data-details-img></div>
      <div class="media-details__info">
        <div class="media-details__head">
          <h2 class="media-details__title" id="details-title" data-details-title></h2>
          <button type="button" class="picker__close" data-details-close aria-label="Close">&times;</button>
        </div>
        <dl class="media-details__facts" data-details-facts></dl>
        <div class="media-details__usage" data-details-usage></div>
        <div class="form__actions">
          <button type="button" class="button button--quiet" data-copy-url>Copy image link</button>
          <a class="button button--quiet" target="_blank" rel="noopener" data-open-url>Open full size</a>
          <button type="button" class="button button--danger" data-delete-media>Delete image</button>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="/js/admin/media.js"></script>
</body>
</html>
